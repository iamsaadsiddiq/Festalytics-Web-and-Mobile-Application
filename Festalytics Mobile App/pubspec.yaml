name: festalytics_app
description: Native Flutter mobile clone regenerated from the complete Festalytics web project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  google_sign_in: ^6.2.2
  provider: ^6.1.5+1
  http: ^1.2.0
  google_fonts: ^6.3.3
  intl: ^0.20.2
  image_picker: ^1.2.2
  mime: ^2.0.0
  url_launcher: ^6.3.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.local
    - assets/data/halls.json
